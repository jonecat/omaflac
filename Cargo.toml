[package]
name = "omaflac"
version = "0.1.0"
edition = "2021"
authors = ["omaflac contributors"]
description = "High quality TUI audio player for Omarchy Linux"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm", "all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rustfft = "6.2"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
anyhow = "1.0"
unicode-width = "0.2"
rand = "0.8"
crossbeam-channel = "0.5"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
